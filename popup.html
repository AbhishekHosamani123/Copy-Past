<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="banner">
    <img src="icons/logo.png" alt="Copy & Paste Freedom">
  </div>

  <header>
    <div>
      <h1>Copy &amp; Paste Freedom</h1>
      <p id="status" class="status">…</p>
    </div>
  </header>

  <main>
    <label class="switch-row" for="toggle">
      <span class="switch-label">Enable copy &amp; paste</span>
      <span class="switch">
        <input type="checkbox" id="toggle" role="switch">
        <span class="slider"></span>
      </span>
    </label>

    <button id="reload" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
        <path d="M21 3v6h-6"/>
      </svg>
      Reload this page
    </button>

    <p class="hint">Shortcut: <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>U</kbd> toggles anytime, even with this popup closed.</p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
